# /etc/nginx/sites-enabled/<file> — fragment dla ofertownik.soft-synergy.com
# Frontend Reacta serwowany statycznie z client/build/.
# API frontend wywołuje pod absolutnym URL https://oferty.soft-synergy.com (patrz oferty.soft-synergy.com.conf).

server {
    server_name ofertownik.soft-synergy.com;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ofertownik.soft-synergy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ofertownik.soft-synergy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ofertownik.soft-synergy.com.access.log;
    error_log  /var/log/nginx/ofertownik.soft-synergy.com.error.log;

    root /var/www/html/oferty/ofertownik-soft-synergy/client/build;
    index index.html;

    # Statyki z hashem w nazwie — długi cache, immutable
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback — wszystko nieznane idzie do index.html
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}

server {
    if ($host = ofertownik.soft-synergy.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name ofertownik.soft-synergy.com;
    return 404;
}
