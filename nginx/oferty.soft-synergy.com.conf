# /etc/nginx/sites-enabled/<file> — fragment dla oferty.soft-synergy.com
# Backend Express (PM2: ofertownik-server) na porcie 5001.
# Cały ruch (API, /uploads/, /dokumenty/, /generated-offers/, /cal) leci przez proxy.

server {
    server_name oferty.soft-synergy.com;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/oferty.soft-synergy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oferty.soft-synergy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/oferty.soft-synergy.com.access.log;
    error_log  /var/log/nginx/oferty.soft-synergy.com.error.log;

    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering on;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

server {
    if ($host = oferty.soft-synergy.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name oferty.soft-synergy.com;
    return 404;
}
